name = "uisu-prerender"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Runs in front of every request to the custom domain.
routes = [
  { pattern = "uisu.space/*", zone_name = "uisu.space" },
  { pattern = "www.uisu.space/*", zone_name = "uisu.space" },
]

